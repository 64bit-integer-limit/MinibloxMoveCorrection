name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ForgeGradle 2.1 / Minecraft 1.8.9 requires exactly Java 8 to compile successfully
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    # Legacy Forge tasks require a headless frame buffer (xvfb) to accommodate vintage Gradle setups
    - name: Build with Gradle
      run: xvfb-run ./gradlew build
